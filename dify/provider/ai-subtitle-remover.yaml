identity:
  author: "sunshinehu"
  name: "ai-subtitle-remover"
  label:
    en_US: "550W AI Media Tools"
    zh_Hans: "550W AI 媒体工具"
    pt_BR: "Ferramentas de mídia 550W AI"
    ja_JP: "550W AI メディアツール"
  description:
    en_US: "Remove video subtitles and watermarks using the 550W Open API."
    zh_Hans: "使用 550W Open API 去除视频字幕与水印。"
    pt_BR: "Remova legendas e marcas d'água de vídeos com a API 550W."
    ja_JP: "550W Open API で動画の字幕と透かしを除去します。"
  icon: "icon.svg"

#########################################################################################
# If you want to support OAuth, you can uncomment the following code.
#########################################################################################
credentials_for_provider:
  userNo:
    type: text-input
    required: true
    label:
      en_US: User number
      zh_Hans: 用户编号
    help:
      en_US: Find your user number at https://eraser.550wai.com/api/
      zh_Hans: 全球版请在 https://eraser.550wai.com/api/ 查看用户编号；中国区可在 https://qzm.550wai.cn/api-keys 查看
    url: https://eraser.550wai.com/api/
  apiKey:
    type: secret-input
    required: true
    label:
      en_US: API key
      zh_Hans: API 密钥
    help:
      en_US: Create an API key at https://eraser.550wai.com/api/
      zh_Hans: 全球版请在 https://eraser.550wai.com/api/ 创建 API 密钥；中国区可在 https://qzm.550wai.cn/api-keys 创建
    url: https://eraser.550wai.com/api/

