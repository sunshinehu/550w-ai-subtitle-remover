identity:
  name: submit_subtitle_task
  author: sunshinehu
  label:
    en_US: Submit subtitle-removal task
    ja_JP: "字幕除去タスクを送信"
    pt_BR: "Enviar tarefa de remoção de legendas"
    zh_Hans: 提交视频去字幕任务
description:
  human:
    en_US: Submit a direct MP4/MOV video URL with its actual dimensions and duration. This creates a billable full-frame processing task.
    ja_JP: "MP4/MOV動画の直接URLと実際の幅、高さ、長さを指定して送信します。フレーム全体を処理する有料タスクが作成されます。"
    pt_BR: "Envie a URL direta de um vídeo MP4/MOV com as dimensões e a duração reais. Isso cria uma tarefa cobrada de processamento de todo o quadro."
    zh_Hans: 使用 MP4/MOV 直链和真实宽高时长提交全画面去字幕任务；该操作可能计费。
  llm: Creates a billable video subtitle-removal task. Only call after the user supplies a direct video URL and actual metadata. Prefer a stable idempotency key; never guess dimensions or duration.
parameters:
  - name: videoUrl
    type: string
    required: true
    label: {en_US: "Direct video URL", zh_Hans: "视频直链", ja_JP: "動画ファイルの直接URL", pt_BR: "URL direta do vídeo"}
    human_description: {en_US: "Public MP4/MOV direct URL", zh_Hans: "公开 MP4/MOV 视频直链", ja_JP: "公開MP4/MOVファイルの直接URL", pt_BR: "URL direta pública de um arquivo MP4/MOV"}
    llm_description: Direct HTTP(S) URL to the video file, not a social share page.
    form: llm
  - name: width
    type: number
    required: true
    label: {en_US: "Width in pixels", zh_Hans: "宽度（像素）", ja_JP: "幅（ピクセル）", pt_BR: "Largura em pixels"}
    human_description: {en_US: "Actual video width", zh_Hans: "视频真实宽度", ja_JP: "動画の実際の幅", pt_BR: "Largura real do vídeo"}
    llm_description: Actual video width in pixels; do not guess.
    form: llm
  - name: height
    type: number
    required: true
    label: {en_US: "Height in pixels", zh_Hans: "高度（像素）", ja_JP: "高さ（ピクセル）", pt_BR: "Altura em pixels"}
    human_description: {en_US: "Actual video height", zh_Hans: "视频真实高度", ja_JP: "動画の実際の高さ", pt_BR: "Altura real do vídeo"}
    llm_description: Actual video height in pixels; do not guess.
    form: llm
  - name: duration
    type: number
    required: true
    label: {en_US: "Duration in seconds", zh_Hans: "时长（秒）", ja_JP: "長さ（秒）", pt_BR: "Duração em segundos"}
    human_description: {en_US: "Actual duration, 1–600 seconds", zh_Hans: "真实时长，1–600 秒", ja_JP: "動画の実際の長さ", pt_BR: "Duração real do vídeo"}
    llm_description: Actual video duration in seconds, 1–600; do not guess.
    form: llm
  - name: idempotencyKey
    type: string
    required: false
    label: {en_US: "Idempotency key", zh_Hans: "幂等键", ja_JP: "冪等キー", pt_BR: "Chave de idempotência"}
    human_description: {en_US: "Reuse only with identical inputs", zh_Hans: "仅与完全相同的参数复用", ja_JP: "入力が同じ場合のみ再利用", pt_BR: "Reutilize somente com os mesmos dados de entrada"}
    llm_description: Optional stable 8–128 character key to prevent duplicate billable submissions.
    form: form
extra:
  python:
    source: tools/submit-subtitle-task.py
