identity:
  name: remove_video_watermark
  author: sunshinehu
  label:
    en_US: Remove short-video watermark
    zh_Hans: 短视频去水印
description:
  human:
    en_US: Use a public video share link copied inside TikTok or another supported app. A successful result costs one credit.
    zh_Hans: 输入在 TikTok 等受支持平台应用内复制的公开视频分享链接；成功一次扣 1 积分。
  llm: Remove a watermark from a public short-video share link. Ask for the link copied inside the app; do not invent a URL or retry after an uncertain paid call.
parameters:
  - name: videoUrl
    type: string
    required: true
    label:
      en_US: Video share link
      zh_Hans: 视频分享链接
    human_description:
      en_US: Public HTTP(S) link or copied share text containing one link.
      zh_Hans: 包含一个 HTTP(S) 链接的公开分享链接或分享文本。
    llm_description: Public video share URL copied inside the social app; TikTok and other supported platforms.
    form: llm
  - name: operationId
    type: string
    required: false
    label:
      en_US: Operation ID
      zh_Hans: 操作编号
    human_description:
      en_US: Optional stable ID for this same URL, 8–64 safe characters.
      zh_Hans: 同一链接可复用的编号，8–64 位安全字符。
    llm_description: Optional 8–64 character idempotency ID. Reuse only for the identical URL.
    form: form
extra:
  python:
    source: tools/remove-video-watermark.py
