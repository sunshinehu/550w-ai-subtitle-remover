identity:
  author: "sunshinehu"
  name: "ai-subtitle-remover-cn"
  label:
    en_US: "550W AI去字幕去水印"
    zh_Hans: "550W AI去字幕去水印"
    pt_BR: "Ferramentas de mídia 550W AI"
    ja_JP: "550W AI メディアツール"
  description:
    en_US: "Upload images or videos for watermark and subtitle removal, or resolve supported video share links."
    zh_Hans: "上传图片或视频去除水印、字幕，也可处理受支持的视频分享链接。"
    pt_BR: "Remova marcas d'água de imagens, legendas ou marcas d'água de vídeos e processe links compartilhados."
    ja_JP: "画像の透かし、動画の字幕や透かし、共有リンクのプラットフォーム透かしを除去します。"
  icon: "icon.png"

# Native OAuth and API Key provider.
credentials_for_provider:
  userNo:
    type: text-input
    required: true
    label:
      en_US: User number
      zh_Hans: 用户编号
    help:
      en_US: Find your user number at https://qzm.550wai.cn/api-keys
      zh_Hans: 请在 https://qzm.550wai.cn/api-keys 查看国内版用户编号
    url: https://qzm.550wai.cn/api-keys
  apiKey:
    type: secret-input
    required: true
    label:
      en_US: API key
      zh_Hans: API 密钥
    help:
      en_US: Create an API key at https://qzm.550wai.cn/api-keys
      zh_Hans: 请在 https://qzm.550wai.cn/api-keys 创建国内版 API 密钥
    url: https://qzm.550wai.cn/api-keys


oauth_schema:
  client_schema:
    - name: oauth_state_secret
      type: secret-input
      required: true
      label: {en_US: OAuth state encryption secret, zh_Hans: OAuth 授权状态加密密钥}
      help:
        en_US: Administrator setup only. Use a unique random secret of at least 32 characters per Dify installation. Keep it stable across workers. Public clients register automatically with S256 PKCE; no shared 550W client secret is needed.
        zh_Hans: 管理员一次性配置，每个 Dify 实例使用独立的至少32字符随机密钥，多节点保持一致。使用 S256 PKCE 自动注册客户端，无需共享550W客户端密钥。
      url: https://qzm.550wai.cn/agent/
  credentials_schema:
    - name: access_token
      type: secret-input
      label: {en_US: Access token, zh_Hans: 访问令牌}
    - name: refresh_token
      type: secret-input
      label: {en_US: Refresh token, zh_Hans: 刷新令牌}
    - name: client_id
      type: text-input
      label: {en_US: Registered client ID, zh_Hans: 注册客户端编号}
    - name: region
      type: text-input
      label: {en_US: Account region, zh_Hans: 账户区域}
tools:
  - tools/query-credits.yaml
  - tools/remove-image-watermark.yaml
  - tools/image-task-detail.yaml
  - tools/remove-video-watermark.yaml
  - tools/submit-local-video.yaml
  - tools/submit-subtitle-task.yaml
  - tools/subtitle-task-detail.yaml
  - tools/operation-detail.yaml
extra:
  python:
    source: provider/ai-subtitle-remover.py
