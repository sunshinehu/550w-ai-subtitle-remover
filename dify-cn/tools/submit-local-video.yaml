identity:
  name: submit_local_video
  author: sunshinehu
  label:
    en_US: Remove local video subtitles or watermark
    ja_JP: "ローカル動画の字幕・透かしを除去"
    pt_BR: "Remover legendas ou marcas d’água de vídeo local"
    zh_Hans: 本地视频去字幕或画面水印
description:
  human:
    en_US: Upload a selected MP4/MOV video and erase subtitles or visual watermarks. Full-frame by default.
    ja_JP: "選択したMP4/MOV動画をアップロードし、字幕や画面上の透かしを除去します。既定ではフレーム全体を処理します。"
    pt_BR: "Envie o vídeo MP4/MOV selecionado para remover legendas ou marcas d’água visuais. Por padrão, todo o quadro é processado."
    zh_Hans: 上传选中的 MP4/MOV 视频，去除硬字幕或画面水印，默认整帧处理。
  llm: Upload only a user-selected video. Submit with a stable idempotency key. Use a rectangle only if the user supplies all coordinates. Processing may take time; report the returned task ID.
parameters:
  - name: file
    type: file
    required: true
    label: {en_US: "Video", zh_Hans: "视频", ja_JP: "動画", pt_BR: "Vídeo"}
    human_description: {en_US: "Selected MP4/MOV video", zh_Hans: "用户选中的 MP4/MOV 视频", ja_JP: "選択したMP4/MOV動画", pt_BR: "Vídeo MP4/MOV selecionado"}
    llm_description: One user-selected local video file.
    form: llm
  - name: idempotencyKey
    type: string
    required: true
    label: {en_US: "Idempotency key", zh_Hans: "幂等键", ja_JP: "冪等キー", pt_BR: "Chave de idempotência"}
    human_description: {en_US: "Stable 8–128 character key", zh_Hans: "稳定的 8–128 位幂等键", ja_JP: "8～128文字の固定キー", pt_BR: "Chave estável de 8 a 128 caracteres"}
    llm_description: Keep the same key for the same video and options when retrying an uncertain submission.
    form: llm
  - name: x1
    type: number
    required: false
    label: {en_US: "Left", zh_Hans: "左边界", ja_JP: "左端", pt_BR: "Esquerda"}
    human_description: {en_US: "Only when user supplies a rectangle", zh_Hans: "仅用户提供区域时填写", ja_JP: "ユーザーが矩形領域を指定した場合のみ", pt_BR: "Somente quando o usuário informar uma área retangular"}
    llm_description: Optional user-supplied left pixel coordinate; provide all four coordinates together.
    form: llm
  - name: y1
    type: number
    required: false
    label: {en_US: "Top", zh_Hans: "上边界", ja_JP: "上端", pt_BR: "Topo"}
    human_description: {en_US: "Only when user supplies a rectangle", zh_Hans: "仅用户提供区域时填写", ja_JP: "ユーザーが矩形領域を指定した場合のみ", pt_BR: "Somente quando o usuário informar uma área retangular"}
    llm_description: Optional user-supplied top pixel coordinate; provide all four coordinates together.
    form: llm
  - name: x2
    type: number
    required: false
    label: {en_US: "Right", zh_Hans: "右边界", ja_JP: "右端", pt_BR: "Direita"}
    human_description: {en_US: "Only when user supplies a rectangle", zh_Hans: "仅用户提供区域时填写", ja_JP: "ユーザーが矩形領域を指定した場合のみ", pt_BR: "Somente quando o usuário informar uma área retangular"}
    llm_description: Optional user-supplied right pixel coordinate; provide all four coordinates together.
    form: llm
  - name: y2
    type: number
    required: false
    label: {en_US: "Bottom", zh_Hans: "下边界", ja_JP: "下端", pt_BR: "Base"}
    human_description: {en_US: "Only when user supplies a rectangle", zh_Hans: "仅用户提供区域时填写", ja_JP: "ユーザーが矩形領域を指定した場合のみ", pt_BR: "Somente quando o usuário informar uma área retangular"}
    llm_description: Optional user-supplied bottom pixel coordinate; provide all four coordinates together.
    form: llm
extra:
  python:
    source: tools/submit-local-video.py
